name: Deploy Astro Blog

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
      - 'src/**/*.astro'
      - 'src/**/*.tsx'
      - 'src/**/*.ts'
      - 'astro.config.mjs'
      - 'package.json'
      - 'tailwind.config.*'
      - 'public/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建 Astro 博客
        run: npx astro build

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: sevik.me
